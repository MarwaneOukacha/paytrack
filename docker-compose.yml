  services:

    # =========================================================
    # PAYMENT DATABASE
    # =========================================================

    payment-db:
      image: postgres:15
      container_name: payment-db

      environment:
        POSTGRES_DB: paymentdb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

      ports:
        - "5434:5432"

      volumes:
        - payment-db-data:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d paymentdb"]
        interval: 10s
        timeout: 5s
        retries: 5


    # =========================================================
    # FRAUD DATABASE
    # =========================================================

    fraud-db:
      image: postgres:15
      container_name: fraud-db

      environment:
        POSTGRES_DB: frauddb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

      ports:
        - "5433:5432"

      volumes:
        - fraud-db-data:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d frauddb"]
        interval: 10s
        timeout: 5s
        retries: 5


    # =========================================================
    # ZOOKEEPER
    # =========================================================

    zookeeper:
      image: confluentinc/cp-zookeeper:7.4.0
      container_name: zookeeper

      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000

      healthcheck:
        test: ["CMD", "nc", "-z", "localhost", "2181"]
        interval: 10s
        timeout: 5s
        retries: 5


    # =========================================================
    # KAFKA
    # =========================================================

    kafka:
      image: confluentinc/cp-kafka:7.4.0
      container_name: kafka

      depends_on:
        zookeeper:
          condition: service_healthy

      ports:
        - "9092:9092"

      environment:
        KAFKA_BROKER_ID: 1

        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      healthcheck:
        test:
          [
            "CMD",
            "kafka-broker-api-versions",
            "--bootstrap-server",
            "localhost:29092"
          ]
        interval: 10s
        timeout: 10s
        retries: 5


    # =========================================================
    # KAFKA UI
    # =========================================================

    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: kafka-ui

      depends_on:
        kafka:
          condition: service_healthy

      ports:
        - "8090:8080"

      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092


    # =========================================================
    # CONFIG SERVER
    # =========================================================

    config-server:
      build:
        context: ./paytrack-config

      container_name: paytrack-config

      ports:
        - "8888:8888"

      environment:
        SERVER_PORT: 8888

        SPRING_APPLICATION_NAME: paytrack-config

      restart: on-failure


    # =========================================================
    # EUREKA REGISTRY
    # =========================================================

    registry:
      build:
        context: ./paytrack-registry

      container_name: paytrack-registry

      depends_on:
        config-server:
          condition: service_started

      ports:
        - "8761:8761"

      environment:
        SERVER_PORT: 8761

        SPRING_APPLICATION_NAME: paytrack-registry

        SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/

      restart: on-failure


    # =========================================================
    # PAYMENT SERVICE
    # =========================================================

    payment-service:
      build:
        context: ./payment-service

      container_name: payment-service

      depends_on:
        payment-db:
          condition: service_healthy

        kafka:
          condition: service_healthy

        config-server:
          condition: service_started

        registry:
          condition: service_started

      ports:
        - "8082:8080"

      environment:
        SERVER_PORT: 8080

        SPRING_APPLICATION_NAME: payment-service

        SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

        SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentdb
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/

      restart: on-failure


    # =========================================================
    # FRAUD SERVICE
    # =========================================================

    fraud-service:
      build:
        context: ./fraud-service

      container_name: fraud-service

      depends_on:
        fraud-db:
          condition: service_healthy

        kafka:
          condition: service_healthy

        config-server:
          condition: service_started

        registry:
          condition: service_started

      ports:
        - "8081:8081"

      environment:
        SERVER_PORT: 8081

        SPRING_APPLICATION_NAME: fraud-service

        SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

        SPRING_DATASOURCE_URL: jdbc:postgresql://fraud-db:5432/frauddb
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/

      restart: on-failure


    # =========================================================
    # API GATEWAY
    # =========================================================

    gateway:
      build:
        context: ./paytrack-gateway

      container_name: paytrack-gateway

      depends_on:
        config-server:
          condition: service_started

        registry:
          condition: service_started

        payment-service:
          condition: service_started

        fraud-service:
          condition: service_started

      ports:
        - "8085:8080"

      environment:
        SERVER_PORT: 8080

        SPRING_APPLICATION_NAME: paytrack-gateway

        SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/

      restart: on-failure


  # ===========================================================
  # VOLUMES
  # ===========================================================

  volumes:

    payment-db-data:

    fraud-db-data:
